# Job sau phiên. 08:45 UTC = 15:45 giờ VN — lệch TuDoanh Radar (15:20), candle-radar (15:35), price-path (15:40)
# để các app không réo cùng lúc, và để DNSE có thêm thời gian chốt nến. Cron dự phòng (16:15, 16:55, 18:20 VN)
# chạy lại nếu lần trước bị GitHub trễ/bỏ HOẶC nguồn chưa chốt — job idempotent nên có file hôm nay rồi thì thoát.
# Chép khuôn price-path; commit thêm data/history.json (kho nến). watchlist.load() ghi docs/data/watchlist.json
# → phải checkout lại trước pull --rebase (bẫy zone.yml của price-path 21/09/2026).
name: daily

on:
  schedule:
    - cron: "45 8 * * 1-5"
    - cron: "15 9 * * 1-5"
    - cron: "55 9 * * 1-5"
    - cron: "20 11 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Chạy lại dù hôm nay đã có file"
        default: "false"
      test_push:
        description: "Gửi một thông báo thử tới mọi máy đã đăng ký"
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Thông báo thử (khi bấm workflow_dispatch với test_push=true)
        if: ${{ github.event.inputs.test_push == 'true' }}
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PUSH_SUBS_FALLBACK: ${{ secrets.PUSH_SUBS_FALLBACK }}
        run: python -m job.push --test

      - name: Quét Wyckoff + push
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PUSH_SUBS_FALLBACK: ${{ secrets.PUSH_SUBS_FALLBACK }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE=--force; else FORCE=; fi
          python -m job.run_daily $FORCE

      - name: Commit kết quả
        run: |
          git config user.name "wyckoff-radar-bot"
          git config user.email "wyckoff-radar-bot@users.noreply.github.com"
          git add docs/data/ data/history.json
          if git diff --cached --quiet; then echo "không có gì mới"; exit 0; fi
          git commit -m "daily: $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase
          git push
